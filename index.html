function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},

		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

module.exports = QRBitBuffer;

"./QRMath":function(module,exports,require){
var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};
	
for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];
}
for (var i = 0; i < 255; i++) {
	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;
}

module.exports = QRMath;

"./QRPolynomial":function(module,exports,require){
var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

},

            d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) ) );

        var d = data << 12;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {

        var digit = 0;

        while (data !== 0) {

        case QRMaskPattern.PATTERN010 : return j % 3 === 0;
        case QRMaskPattern.PATTERN011 : return (i + j) % 3 === 0;
        case QRMaskPattern.PATTERN100 : return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 === 0;
        case QRMaskPattern.PATTERN101 : return (i * j) % 2 + (i * j) % 3 === 0;
        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;
        case QRMaskPattern.PATTERN111 : return ( (i * j) % 3 + (i + j) % 2) % 2 === 0;

            throw new Error("bad maskPattern:" + maskPattern);
        }
    },

        var a = new QRPolynomial([1], 0);

        for (var i = 0; i < errorCorrectLength; i++) {
            a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0) );
        }

            // 1 - 9

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 10;
            case QRMode.MODE_ALPHA_NUM  : return 9;
            case QRMode.MODE_8BIT_BYTE  : return 8;
            case QRMode.MODE_KANJI      : return 8;
            default :
                throw new Error("mode:" + mode);
            }

            // 10 - 26

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 12;
            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 10;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 41) {

            // 27 - 40

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 12;
            default :
                throw new Error("mode:" + mode);
            }

        } else {
            throw new Error("type:" + type);
        }
    },

    getLostPoint : function(qrCode) {
        
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;
	this.dataCache = null;
	this.dataList = [];
}

QRCode.prototype = {
	
	addData : function(data) {
		var newData = new QR8bitByte(data);
		this.dataList.push(newData);
		this.dataCache = null;
	},
	
	isDark : function(row, col) {
		if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
			throw new Error(row + "," + col);
		}
		return this.modules[row][col];
	},

	getModuleCount : function() {
		return this.moduleCount;
	},
	
	make : function() {
		// Calculate automatically typeNumber if provided is < 1
		if (this.typeNumber < 1 ){
			var typeNumber = 1;
			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}
				if (buffer.getLengthInBits() <= totalDataCount * 8)
					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},
	
	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);
	},

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

{"title":"曲名（看不出來就寫 未命名樂曲）","tokens":"…","key":"調號，例如 G 大調","simplified":true或false,"note":"一句話說明簡化或看不清楚的地方"}
tokens 規則：
- 完全保留譜上寫的音高，不要轉調、不要自己加減八度（直笛譜通常記在比實際發音低一個八度的位置，照譜上寫的位置就好）。用音名加八度表示譜上位置，C4＝中央 C（下加一線），例如 C4 D4 F#4 Bb4 D5（升用 #、降用 b）。調號與臨時記號要套用到每個受影響的音。簡譜依「1=調」換算成譜上音高，無加點的數字取最接近 C4～D5 的八度，上加點＝高八度、下加點＝低八度。超出 C4～D5 的音照實寫並在 note 說明。
- 以四分音符為 1 拍：四分音符＝音名（E4），二分音符＝E4-，附點二分音符＝E4--，全音符＝E4---，八分音符＝E4/，十六分音符＝E4//，附點加 .（附點四分音符＝E4.，附點八分音符＝E4/.），休止符同理（四分休止＝0，八分休止＝0/）。
- 每個音都要照譜上的節奏寫，不要合併或省略短音符；三連音等無法精確表示的節奏，用最接近的寫法並在 note 說明，simplified 設為 true，其他情況設為 false。
- 音與音之間用空格，樂句用 | 分隔，約一到兩小節一句。
- 只輸出 JSON。`;

const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=s=>{s=String(s).replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return decodeURIComponent(escape(atob(s)))};
const joinCode=()=>b64e(JSON.stringify({g:M0.g,t:M0.tok}));
const joinLink=()=>location.origin+location.pathname+"#rgsync="+joinCode();
function parseJoin(v){v=String(v||"").trim();const m=/#rgsync=([A-Za-z0-9_\-]+)/.exec(v);if(m)v=m[1];try{const o=JSON.parse(b64d(v));if(o&&o.g&&o.t)return{g:String(o.g),t:String(o.t)}}catch(e){}return null}
// ---- GitHub API ----
const GH="https://api.github.com";
const hdr=tok=>({"Authorization":"Bearer "+tok,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
function ghErr(r){const s=r.status;return new Error(s===401?"權杖不正確或已過期":s===403?"權杖沒有 Gists 權限，或使用次數暫時太多":s===404?"找不到雲端資料（可能被刪除，或權杖沒有權限）":s===422?"資料格式不正確":"連線錯誤 HTTP "+s)}
const CF="rg-cfg.json",CLF=id=>"rg-cls-"+id+".json";
async function get(g,tok){g=g||M0.g;tok=tok||M0.tok;const r=await fetch(GH+"/gists/"+encodeURIComponent(g),{headers:hdr(tok),cache:"no-store"});if(!r.ok)throw ghErr(r);const o=await r.json(),R={cfg:null,cls:{}};
 for(const [name,f] of Object.entries(o.files||{})){if(!/^rg-/.test(name))continue;let txt=f.content;if(f.truncated&&f.raw_url){const rr=await fetch(f.raw_url,{cache:"no-store"});if(rr.ok)txt=await rr.text()}const v=J(txt);if(!v||!v.d)continue;
  if(name===CF)R.cfg=v;else{const m=/^rg-cls-(.+)\.json$/.exec(name);if(m)R.cls[m[1]]=v}}return R}
async function sendFiles(files){const r=await fetch(GH+"/gists/"+encodeURIComponent(M0.g),{method:"PATCH",headers:Object.assign({"Content-Type":"application/json"},hdr(M0.tok)),body:JSON.stringify({files})});if(!r.ok)throw ghErr(r)}
async function createGist(tok){const r=await fetch(GH+"/gists",{method:"POST",headers:Object.assign({"Content-Type":"application/json"},hdr(tok)),body:JSON.stringify({description:"直笛守護者 雲端同步資料（請勿刪除）",public:false,files:{"README.md":{content:"# 直笛守護者 雲端同步資料\n\n這個 Gist 由「直笛守護者」遊戲自動建立，用來在不同平板之間同步老師設定與各班進度。請不要刪除或修改。\n"}}})});if(!r.ok)throw ghErr(r);return(await r.json()).id}
// ---- 本機資料 ----
const CL=()=>{try{return JSON.parse(ls.getItem("rgClasses"))||{list:[]}}catch(e){return{list:[]}}};
const bk=(id,k)=>"rgC:"+id+":"+k;
function mark(k){if(muted||!on()||k===MK)return;let hit=false;if(GK.includes(k)){M0.dc=true;hit=true}else if(PK.includes(k)){const c=CL().cur;if(c){M0.dk[c]=true;hit=true}}else{const m=/^rgC:([^:]+):(.+)$/.exec(k);if(m&&PK.includes(m[2])){M0.dk[m[1]]=true;hit=true}}if(hit){save();clearTimeout(timer);timer=setTimeout(()=>push(),5000);dot()}}
Storage.prototype.setItem=function(k,v){raw.set.call(this,k,v);if(this===ls)mark(String(k))};
Storage.prototype.removeItem=function(k){raw.rm.call(this,k);if(this===ls)mark(String(k))};
const put=(k,v)=>{v==null?raw.rm.call(ls,k):raw.set.call(ls,k,v)};
function readCls(id){const cur=CL().cur===id,d={};PK.forEach(k=>{d[k]=ls.getItem(cur?k:bk(id,k))});return d}
function writeCls(id,d){const cur=CL().cur===id;muted=true;PK.forEach(k=>{if(k in d)put(cur?k:bk(id,k),d[k])});muted=false}
function readCfg(){const d={};GK.forEach(k=>{d[k]=ls.getItem(k)});return d}
function writeCfg(d){muted=true;GK.forEach(k=>{if(!(k in d))return;if(k==="rgClasses"){let r;try{r=JSON.parse(d[k])}catch(e){}if(!r||!Array.isArray(r.list)||!r.list.length)return;const cur=CL().cur;r.cur=r.list.some(c=>c.id===cur)?cur:r.list[0].id;put(k,JSON.stringify(r));return}put(k,d[k])});muted=false}
const J=s=>{try{return JSON.parse(s)}catch(e){return null}},nn=o=>Object.fromEntries(Object.entries(o).filter(([k,v])=>v!=null));
// 合併：星星、最高分取較高，完成的任務合併，經驗值取較高
function mergeCls(rem,loc){const o=Object.assign({},rem,nn(loc));["rgStars","rgBest"].forEach(k=>{const a=J(rem[k])||{},b=J(loc[k])||{},m=Object.assign({},a);Object.keys(b).forEach(x=>{m[x]=Math.max(+a[x]||0,+b[x]||0)});o[k]=JSON.stringify(m)});
 const a=J(rem.rgMQ),b=J(loc.rgMQ);if(a||b){const m={m:[...new Set([...(a&&a.m||[]),...(b&&b.m||[])])],s:[...new Set([...(a&&a.s||[]),...(b&&b.s||[])])]};o.rgMQ=JSON.stringify(Object.assign({},a,b,m))}
 const pa=J(rem.rgProf),pb=J(loc.rgProf);if(pa&&pb&&(+pa.exp||0)>(+pb.exp||0)){pb.exp=pa.exp;o.rgProf=JSON.stringify(pb)}return o}
function mergeCfg(rem,loc){const o=Object.assign({},rem,nn(loc)),a=J(rem.rgUser),b=J(loc.rgUser);if(a&&b)o.rgUser=JSON.stringify(Object.assign({},a,b));const ca=J(rem.rgClasses),cb=J(loc.rgClasses);if(ca&&cb&&Array.isArray(ca.list)&&Array.isArray(cb.list)){const ids=new Set(cb.list.map(c=>c.id));cb.list=cb.list.concat(ca.list.filter(c=>!ids.has(c.id)));o.rgClasses=JSON.stringify(cb)}return o}
const same=(a,b,keys)=>keys.every(k=>(a[k]??null)===(b[k]??null));
const playing=()=>{const m=document.getElementById("menu");return!m||m.hidden||m.style.visibility==="hidden"};
// ---- 下載：把別台平板的新資料寫進這台 ----
async function pull(boot){if(!on()||busy)return;busy=true;state="sync";dot();let reload=false;
 try{const R=await get();
  if(R.cfg&&R.cfg.t>(M0.cfgT||0)){writeCfg(M0.dc?mergeCfg(R.cfg.d,readCfg()):R.cfg.d);M0.cfgT=R.cfg.t;reload=true}
  const cur=CL().cur;CL().list.forEach(c=>{const x=R.cls[c.id];if(!x||x.t<=(M0.cls[c.id]||0))return;writeCls(c.id,M0.dk[c.id]?mergeCls(x.d,readCls(c.id)):x.d);M0.cls[c.id]=x.t;if(c.id===cur)reload=true});
  M0.at=Date.now();save();state="ok";lastErr=""}
 catch(e){state="err";lastErr=e.message||String(e)}busy=false;dot();if(panel&&!panel.hidden)draw();
 if(M0.dc||Object.keys(M0.dk).length)push();
 if(reload){if(boot){let n=0;try{n=+sessionStorage.getItem("rgSyncR")||0}catch(e){}if(Date.now()-n>15000){try{sessionStorage.setItem("rgSyncR",String(Date.now()))}catch(e){}location.reload();return}}banner()}}
// ---- 上傳：這台改過的資料（一次送出） ----
async function push(force){if(!on())return;if(busy){clearTimeout(timer);timer=setTimeout(()=>push(force),1500);return}const ids=force?CL().list.map(c=>c.id):Object.keys(M0.dk);if(!M0.dc&&!ids.length&&!force)return;busy=true;state="sync";dot();
 try{const R=force?{cfg:null,cls:{}}:await get(),t=Date.now(),files={},done=[];let cfgSent=false;
  if(M0.dc||force){const loc=readCfg(),d=R.cfg&&R.cfg.t>(M0.cfgT||0)?mergeCfg(R.cfg.d,loc):loc;if(d!==loc&&!same(d,loc,GK))writeCfg(d);files[CF]={content:JSON.stringify({t,d})};cfgSent=true}
  for(const id of ids){if(!CL().list.some(c=>c.id===id)){delete M0.dk[id];continue}const loc=readCls(id),x=R.cls[id],d=x?mergeCls(x.d,loc):loc;
   if(d!==loc&&!same(d,loc,PK)){writeCls(id,d);if(id===CL().cur)banner()}files[CLF(id)]={content:JSON.stringify({t,d})};done.push(id)}
  if(Object.keys(files).length)await sendFiles(files);
  if(cfgSent){M0.cfgT=t;M0.dc=false}done.forEach(id=>{M0.cls[id]=t;delete M0.dk[id]});
  M0.at=Date.now();save();state="ok";lastErr=""}
 catch(e){state="err";lastErr=e.message||String(e)}busy=false;dot();if(panel&&!panel.hidden)draw()}
function banner(){if(playing()){setTimeout(banner,5000);return}let b=document.getElementById("syncban");if(b)return;b=document.createElement("button");b.id="syncban";b.innerHTML="☁️ 收到其他平板的新資料，點這裡更新畫面";b.onclick=()=>location.reload();document.body.appendChild(b)}
// ---- 介面 ----
let btn=null,panel=null,showQR=false,pend=null;
function dot(){if(!btn)return;const i=btn.querySelector("i");btn.dataset.st=on()?state||"ok":"off";i.textContent=!on()?"☁️":state==="err"?"⚠️":state==="sync"?"🔄":"☁️"}
function addBtn(){const r=document.getElementById("hubr");if(!r||r.querySelector("#syncbtn"))return;r.insertAdjacentHTML("beforeend",`<button class="ib" id="syncbtn" aria-label="雲端同步"><i>☁️</i><span>雲端同步</span></button>`);btn=r.querySelector("#syncbtn");btn.onclick=e=>{e.stopPropagation();open()};dot()}
setInterval(addBtn,1000);addBtn();
const tm=t=>t?new Date(t).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
function open(){if(!panel){panel=document.createElement("div");panel.className="sheet";panel.id="sh-sync";panel.style.cssText="position:fixed;z-index:60";panel.innerHTML=`<div class="sp" role="dialog" aria-label="雲端同步" style="max-width:680px"><div class="sh"><span>☁️ 雲端同步</span><button class="sx" aria-label="關閉">✕</button></div><div class="sc"></div></div>`;document.body.appendChild(panel);panel.querySelector(".sx").onclick=()=>panel.hidden=true;panel.onclick=e=>{if(e.target===panel)panel.hidden=true;act(e)}}panel.hidden=false;draw()}
const waiting=()=>M0.dc||Object.keys(M0.dk).length;
function qrHTML(){let q="";try{q=window.QRGen?window.QRGen(joinLink()):""}catch(e){}return`<div class="syqr"><b>📱 讓其他平板連上同一個雲端</b><p>用平板的<b>相機</b>對準下面的 QR code，點跳出的連結用 Safari 開啟，就會自動連線。</p>${q?`<div class="syqrimg">${q}</div>`:""}<p>或複製下面的「連線碼」，在其他平板的雲端同步畫面貼上：</p><textarea readonly rows="3" id="syjoin">${joinCode()}</textarea><button class="qa" data-sy="copy">📋 複製連線碼</button><p class="sywarn">⚠️ 連線碼和 QR code 就像鑰匙，請不要讓學生拍到或拿到。</p></div>`}
function draw(){const c=panel.querySelector(".sc");
 c.innerHTML=`<p class="sub" style="font-size:17px;line-height:1.7">連上同一個雲端的平板會共用：<br>📚 曲目、資料夾、城堡曲目、年級任務、魔法卡、班級名單<br>🏫 各班的等級、金幣、星星、任務進度<br><small>資料存在您 GitHub 帳號裡一個不公開的 Gist。主題、節拍器等「這台平板的顯示設定」，以及排位戰排行榜不會同步。</small></p>
 ${on()?`<div class="qr done"><div class="qi">${state==="err"?"⚠️":"✅"}</div><div><div class="qt">已連上 GitHub 雲端</div><div class="qd">${state==="err"?`<span style="color:#c62828">暫時無法同步（${esc(lastErr)}）。資料會先存在這台平板，恢復後會自動補傳。</span>`:`上次同步：${tm(M0.at)}${waiting()?"　（有資料等待上傳）":""}`}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="qa claim" data-sy="now">🔄 立即同步</button><button class="qa" data-sy="qr">📱 連接其他平板</button><button class="qa" data-sy="off">中斷</button></div></div>${showQR?qrHTML():""}<details class="syset"><summary><b>📦 從舊網址（preeminent-panda…netlify.app）搬資料過來</b></summary><p>以前在舊網址的雲端同步輸入過同步代碼的話，把那組代碼打在這裡，舊雲端上的班級、曲目和各班進度就會合併進來（不會刪掉現在的資料）。</p><div class="syrow"><input id="syold" placeholder="舊的同步代碼，例如 cindy-music" autocomplete="off"><button class="qa claim" data-sy="old">搬過來</button></div></details>`
 :`<div class="syset"><h3>🅰 已經有平板連上了？</h3><p>在那台平板按「📱 連接其他平板」，用這台的相機掃 QR code 就好。沒有相機的話，把連線碼貼在這裡：</p><div class="syrow"><input id="syjc" placeholder="貼上連線碼" autocomplete="off"><button class="qa claim" data-sy="join">連線</button></div></div>
 <div class="syset"><h3>🅱 第一次設定（只在第一台平板做）</h3><ol><li>電腦登入 GitHub，打開 <b>github.com/settings/personal-access-tokens/new</b>。</li><li>Token name 填「直笛守護者」，Expiration 選最長的期限。</li><li>往下找到 <b>Permissions</b> → <b>Account permissions</b> → <b>Gists</b>，選 <b>Read and write</b>。其他都不用改。</li><li>按最下面的 <b>Generate token</b>，複製 <code>github_pat_</code> 開頭的那串，貼到下面。</li></ol><div class="syrow"><input id="sytok" type="password" placeholder="貼上 github_pat_… 權杖" autocomplete="off"><button class="qa claim" data-sy="make">建立雲端</button></div></div>`}
 <div id="syask"></div>`}
function ask(h){const a=panel.querySelector("#syask");a&&(a.innerHTML=h)}
const err=m=>`<p style="color:#c62828;text-align:center;font-weight:900">${esc(m)}</p>`;
const tst=h=>{try{typeof toast==="function"&&toast(h)}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function join(g,tok){ask(`<p style="text-align:center">🔄 連線中…</p>`);let R;try{R=await get(g,tok)}catch(e){ask(err("無法連線："+e.message));return}
 M0=Object.assign(blank(),{g,tok});const has=R.cfg||Object.keys(R.cls).length;
 if(!has){save();state="ok";await push(true);showQR=false;draw();tst("✅ 已連上雲端");return}
 pend=R;ask(`<div class="qr"><div class="qi">☁️</div><div><div class="qt">雲端上已經有資料</div><div class="qd">最後更新：${tm(Math.max(R.cfg?R.cfg.t:0,...Object.values(R.cls).map(x=>x.t)))}，共 ${R.cfg?(J(R.cfg.d.rgClasses)||{list:[]}).list.length:0} 個班級</div></div></div>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px"><button class="qa claim" data-sy="down" style="font-size:19px">⬇ 使用雲端資料（建議）</button><button class="qa" data-sy="up" style="font-size:19px">⬆ 用這台的資料覆蓋雲端</button></div>`)}
async function act(e){const b=e.target.closest("[data-sy]");if(!b)return;const k=b.dataset.sy,c=panel.querySelector(".sc");
 if(k==="now"){state="sync";draw();await push().catch(()=>{});await pull();draw();return}
 if(k==="qr"){showQR=!showQR;draw();return}
 if(k==="copy"){const ta=c.querySelector("#syjoin");try{await navigator.clipboard.writeText(ta.value);b.textContent="已複製 ✓"}catch(x){ta.select();b.textContent="請手動全選複製"}return}
 if(k==="off"){if(!confirm("讓這台平板中斷雲端同步？（雲端上的資料不會被刪除）"))return;M0=blank();save();state="";showQR=false;dot();draw();return}
 if(k==="join"){const o=parseJoin(c.querySelector("#syjc").value);if(!o){ask(err("連線碼不正確，請重新複製一次。"));return}join(o.g,o.t);return}
 if(k==="make"){const tok=(c.querySelector("#sytok").value||"").trim();if(!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(tok)){ask(err("權杖格式不對：應該是 github_pat_ 開頭的一長串文字。"));return}
  ask(`<p style="text-align:center">🔄 正在建立雲端…</p>`);let g;try{g=await createGist(tok)}catch(x){ask(err("建立失敗："+x.message));return}
  M0=Object.assign(blank(),{g,tok});save();state="ok";await push(true);showQR=true;draw();tst("✅ 雲端建立完成！");return}
 if(k==="old"){const code=(c.querySelector("#syold").value||"").trim();if(!code){ask(err("請輸入舊的同步代碼"));return}ask(`<p style="text-align:center">🔄 讀取舊雲端…</p>`);let R;
  try{const r=await fetch("https://preeminent-panda-8bf364.netlify.app/api/sync?code="+encodeURIComponent(code),{cache:"no-store"});if(!r.ok)throw new Error(r.status===400?"代碼格式不對":"HTTP "+r.status);R=await r.json()}catch(x){ask(err("讀不到舊雲端："+x.message));return}
  if(!R||(!R.cfg&&!Object.keys(R.cls||{}).length)){ask(err("舊雲端上找不到這組代碼的資料，請確認代碼是否正確。"));return}
  if(R.cfg&&R.cfg.d)writeCfg(mergeCfg(R.cfg.d,readCfg()));
  const ids=CL().list.map(x=>x.id);Object.entries(R.cls||{}).forEach(([id,x])=>{if(x&&x.d&&ids.includes(id))writeCls(id,mergeCls(x.d,readCls(id)))});
  M0.dc=true;ids.forEach(id=>M0.dk[id]=true);save();await push();
  ask(`<p style="text-align:center;font-weight:900;color:#2e7d32">✅ 搬好了！共 ${CL().list.length} 個班級。畫面即將重新整理…</p>`);setTimeout(()=>location.reload(),1500);return}
 if(k==="down"){const R=pend;if(!R)return;if(R.cfg){writeCfg(R.cfg.d);M0.cfgT=R.cfg.t}CL().list.forEach(c=>{const x=R.cls[c.id];if(x){writeCls(c.id,x.d);M0.cls[c.id]=x.t}});M0.dc=false;M0.dk={};M0.at=Date.now();save();location.reload();return}
 if(k==="up"){save();state="ok";await push(true);draw();return}}
// 掃 QR code 開啟的連結：#rgsync=…
function fromHash(){const m=/^#rgsync=([A-Za-z0-9_\-]+)/.exec(location.hash);if(!m)return;const o=parseJoin(m[1]);try{history.replaceState(null,"",location.pathname+location.search)}catch(e){location.hash=""}
 if(!o)return;const go=()=>{if(!document.getElementById("hubr")){setTimeout(go,300);return}addBtn();open();if(on()&&M0.g===o.g){ask(`<p style="text-align:center">這台平板已經連上同一個雲端了。</p>`);return}join(o.g,o.t)};go()}
fromHash();window.addEventListener("hashchange",fromHash);
// 開啟遊戲時下載、在大廳時每分鐘檢查一次
if(on())setTimeout(()=>pull(true),300);
setInterval(()=>{if(on()&&!playing()&&document.visibilityState==="visible")pull()},30000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&on()&&!playing())pull();if(document.visibilityState==="hidden"&&on())push()});
window.rgSync={pull,push,meta:()=>M0};
})();
